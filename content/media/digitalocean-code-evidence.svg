<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">Check a DigitalOcean promotional code in three stages</title>
  <desc id="desc">Find the provider-issued offer, check eligible services and expiration, then confirm acceptance and charges in the account.</desc>
  <rect width="800" height="500" rx="26" fill="#eaf2fc"/>
  <text x="48" y="70" fill="#173b6b" font-family="Arial,sans-serif" font-size="34" font-weight="700">A code is a claim until verified</text>
  <text x="48" y="108" fill="#4b6380" font-family="Arial,sans-serif" font-size="22">Follow the evidence through the actual account.</text>
  <rect x="48" y="154" width="220" height="254" rx="18" fill="#fff" stroke="#bfd4ed" stroke-width="3"/>
  <rect x="290" y="154" width="220" height="254" rx="18" fill="#fff" stroke="#bfd4ed" stroke-width="3"/>
  <rect x="532" y="154" width="220" height="254" rx="18" fill="#fff" stroke="#bfd4ed" stroke-width="3"/>
  <circle cx="86" cy="194" r="22" fill="#1768b5"/><text x="79" y="204" fill="#fff" font-family="Arial,sans-serif" font-size="27" font-weight="700">1</text>
  <circle cx="328" cy="194" r="22" fill="#1768b5"/><text x="321" y="204" fill="#fff" font-family="Arial,sans-serif" font-size="27" font-weight="700">2</text>
  <circle cx="570" cy="194" r="22" fill="#1768b5"/><text x="563" y="204" fill="#fff" font-family="Arial,sans-serif" font-size="27" font-weight="700">3</text>
  <text x="67" y="252" fill="#173b6b" font-family="Arial,sans-serif" font-size="25" font-weight="700">Issuer</text>
  <text x="67" y="294" fill="#4b6380" font-family="Arial,sans-serif" font-size="21">Provider page or</text><text x="67" y="326" fill="#4b6380" font-family="Arial,sans-serif" font-size="21">direct offer?</text>
  <text x="309" y="252" fill="#173b6b" font-family="Arial,sans-serif" font-size="25" font-weight="700">Terms</text>
  <text x="309" y="294" fill="#4b6380" font-family="Arial,sans-serif" font-size="21">Eligible service,</text><text x="309" y="326" fill="#4b6380" font-family="Arial,sans-serif" font-size="21">limit and expiry?</text>
  <text x="551" y="252" fill="#173b6b" font-family="Arial,sans-serif" font-size="25" font-weight="700">Account</text>
  <text x="551" y="294" fill="#4b6380" font-family="Arial,sans-serif" font-size="21">Accepted balance</text><text x="551" y="326" fill="#4b6380" font-family="Arial,sans-serif" font-size="21">and actual bill?</text>
  <text x="48" y="459" fill="#1768b5" font-family="Arial,sans-serif" font-size="22" font-weight="700">A search snippet is not proof of a working code.</text>
</svg>
